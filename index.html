<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fibonacci Chat Area" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="Fibonacci Chat Area — Multi-model AI chat web client" />
    <meta property="og:title" content="Fibonacci Chat Area" />
    <meta property="og:description" content="Fibonacci Chat Area — Multi-model AI chat web client" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Fibonacci Chat Area</title>
    <script>
      (function () {
        var initialTheme = localStorage.getItem('initial-theme');
        if (initialTheme === 'light' || initialTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', initialTheme);
          if (initialTheme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      html[data-theme="dark"] {
        background-color: #101010;
      }
      html[data-theme="light"] {
        background-color: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
