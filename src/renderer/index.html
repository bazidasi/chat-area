<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="%VIEWPORT_CONTENT%"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fibonacci Chat Area" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Fibonacci Chat Area" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/static/favicon.png" sizes="64x64" />
    <title>Fibonacci Chat Area</title>
    <script>
      var initialTheme = localStorage.getItem("initial-theme");
      if (initialTheme === "light" || initialTheme === "dark") {
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          initialTheme
        );
      }
    </script>
    <style>
      /* Keep these literals in sync with DEFAULT_INTERFACE_COLORS in
         src/shared/theme-colors.ts — the splash paints before CSS loads. */
      html[data-theme="dark"] {
        background-color: #141414;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 1;
        background-color: #f2f5fa;
        overflow: hidden;
      }
      html[data-theme="dark"] .splash-screen {
        background-color: #1a1d24;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
      }

      .splash-screen-logo {
        display: block;
        color: #8b0000;
        filter: drop-shadow(0 10px 24px rgba(139, 0, 0, 0.35));
      }
      html[data-theme="dark"] .splash-screen-logo {
        color: #b71c1c;
        filter: drop-shadow(0 10px 24px rgba(183, 28, 28, 0.3));
      }

      .splash-screen-logo-bg {
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #8b0000;
        opacity: 0.22;
      }
      html[data-theme="dark"] .splash-screen-logo-bg {
        color: #b71c1c;
        opacity: 0.16;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

    <div id="root"></div>
    <div class="splash-screen">

      <div class="splash-screen-content">

</svg>

</html>
